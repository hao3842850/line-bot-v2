<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KRONO 開單系統</title>
<!-- 開單系統網頁（在 LINE 裡開啟的 LIFF 網頁）。配色與機器人卡片相同：深紫 + 金 -->
<style>
  :root {
    --primary: #3B2667; --gold: #F5C542; --ok: #27AE60; --warn: #F39C12; --err: #E74C3C; --grey: #95A5A6;
    --text: #1A1A1A; --sub: #8C8C8C; --line: #EEEAF5; --bg: #F6F3FB; --head-sub: #C9BFE3;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-size: 14px; }
  button { font: inherit; border: 0; cursor: pointer; }
  .top { background: var(--primary); color: #fff; padding: 16px 16px 12px; position: sticky; top: 0; z-index: 5; }
  .top .t { font-size: 19px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .top .s { font-size: 12px; color: var(--head-sub); margin-top: 3px; }
  .back { background: none; color: #fff; font-size: 20px; padding: 0 6px 0 0; }
  .tabs { display: flex; background: var(--primary); padding: 0 6px; position: sticky; top: 62px; z-index: 5; overflow-x: auto; }
  .tab { flex: 1; min-width: 64px; background: none; color: var(--head-sub); font-size: 13px; padding: 10px 0 9px; border-bottom: 3px solid transparent; white-space: nowrap; }
  .tab.on { color: var(--gold); border-color: var(--gold); font-weight: 700; }
  .wrap { padding: 12px 12px 96px; max-width: 560px; margin: 0 auto; }
  .card { background: #fff; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(59,38,103,.08); }
  .tap { cursor: pointer; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 3px 0; }
  .l { color: var(--sub); font-size: 13px; } .v { font-weight: 700; }
  .big { font-size: 17px; font-weight: 800; color: var(--primary); }
  .sm { font-size: 12px; color: var(--sub); }
  .pill { font-size: 11px; font-weight: 700; color: #fff; padding: 2px 9px; border-radius: 20px; white-space: nowrap; }
  .p-open { background: var(--warn); } .p-settled { background: var(--ok); } .p-closed { background: var(--grey); } .p-canceled { background: var(--err); }
  .p-me { background: var(--primary); } .p-paid { background: var(--ok); } .p-unpaid { background: var(--warn); }
  .btn { display: block; width: 100%; text-align: center; padding: 13px; border-radius: 10px; font-weight: 800; font-size: 15px; margin-top: 10px; }
  .b-primary { background: var(--primary); color: #fff; } .b-gold { background: var(--gold); color: var(--primary); }
  .b-grey { background: #E5E5EA; color: #555; } .b-danger { background: #fff; color: var(--err); border: 1px solid #F5C6C1; }
  .btn:disabled { opacity: .5; }
  .fab { position: fixed; right: 18px; bottom: calc(20px + env(safe-area-inset-bottom)); background: var(--gold); color: var(--primary); font-weight: 800; padding: 14px 20px; border-radius: 30px; box-shadow: 0 3px 10px rgba(0,0,0,.2); font-size: 15px; z-index: 6; }
  label { display: block; font-size: 12px; color: var(--sub); margin: 12px 0 5px; }
  input[type=text], input[type=search], input[inputmode=numeric] { width: 100%; padding: 11px 12px; border: 1px solid #DDD6EC; border-radius: 9px; font-size: 16px; background: #fff; color: var(--text); outline: none; }
  input:focus { border-color: var(--primary); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; max-height: 260px; overflow-y: auto; padding: 2px; }
  .chip { font-size: 13px; padding: 7px 11px; border-radius: 20px; background: #fff; border: 1px solid #DDD6EC; color: #555; }
  .chip.on { background: var(--primary); color: #fff; border-color: var(--primary); }
  .chip .c { font-size: 10px; opacity: .7; margin-left: 4px; }
  .sum { background: var(--primary); color: #fff; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .sum .k { font-size: 12px; color: var(--head-sub); } .sum .n { font-size: 28px; font-weight: 800; color: var(--gold); margin: 2px 0; }
  .mem { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .mem:last-child { border-bottom: 0; }
  .av { width: 30px; height: 30px; border-radius: 50%; background: #E3DCF2; color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; flex: none; }
  .mem .n { flex: 1; } .x { background: none; color: var(--sub); font-size: 16px; padding: 4px 6px; }
  .empty { text-align: center; color: var(--sub); padding: 40px 0; }
  .toast { position: fixed; left: 50%; top: 76px; transform: translateX(-50%); background: rgba(30,18,54,.92); color: #fff; padding: 10px 16px; border-radius: 20px; font-size: 13px; z-index: 20; display: none; max-width: 86%; text-align: center; }
  .hint { font-size: 12px; color: var(--sub); margin-top: 6px; }
  .rank { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .rank:last-child { border-bottom: 0; }
</style>
</head>
<body>
<div id="app"><div class="empty">載入中…</div></div>
<div class="toast" id="toast"></div>

<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
// ========================= 基本設定 =========================
const LIFF_ID = "__LIFF_ID__";                 // 由後端填入
const Q = new URLSearchParams(location.search);
const GROUP = Q.get("g") || "";                // 從群組卡片開啟時帶的群組代碼
const STATUS = { open: "報名中", settled: "發鑽中", closed: "已結單", canceled: "已取消" };
let ME = null;                                 // 目前使用者
let state = { view: "list", tab: "open", orderId: null };
let CUR = null;                                // 目前打開的單
const app = document.getElementById("app");

// ========================= 小工具 =========================
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => Number(n || 0).toLocaleString("en-US");
const date = s => { if (!s) return ""; const d = new Date(s); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 2200); }

// 呼叫後端 API（附上 LINE 身分）
async function api(path, body) {
  const opt = { headers: { Authorization: "Bearer " + liff.getIDToken(), "Content-Type": "application/json" } };
  if (body !== undefined) { opt.method = "POST"; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || "發生錯誤，請稍後再試");
  return data;
}

// 在群組送出「查單 N」，讓機器人回覆卡片（用使用者身分送出，不吃機器人推播額度）
async function notifyGroup(orderId) {
  try {
    const ctx = liff.getContext();
    if (liff.isInClient() && ctx && (ctx.type === "group" || ctx.type === "room")) {
      await liff.sendMessages([{ type: "text", text: `查單 ${orderId}` }]);
    }
  } catch (e) { console.log("sendMessages 失敗", e); }
}

function go(view, extra = {}) {
  state = { ...state, view, ...extra };
  // 把目前畫面記在網址上，重新整理時會停在同一頁
  const u = new URL(location.href);
  u.searchParams.delete("new"); u.searchParams.delete("order");
  if (view === "detail") u.searchParams.set("order", state.orderId);
  if (view === "create") u.searchParams.set("new", "1");
  history.replaceState(null, "", u);
  render(); window.scrollTo(0, 0);
}

// ========================= 畫面：列表 =========================
async function renderList() {
  const tabs = [["open", "報名中"], ["settled", "發鑽中"], ["closed", "已結單"], ["mine", "我的"]];
  if (ME.is_admin) tabs.push(["admin", "總覽"], ["members", "人員"]);
  const head = `
    <div class="top"><div class="t">💰 開單</div><div class="s">${esc(ME.name)}${ME.clan ? " · " + esc(ME.clan) : ""}</div></div>
    <div class="tabs">${tabs.map(([k, n]) => `<button class="tab ${state.tab === k ? "on" : ""}" onclick="go('list',{tab:'${k}'})">${n}</button>`).join("")}</div>`;
  app.innerHTML = head + `<div class="wrap"><div class="empty">載入中…</div></div><button class="fab" onclick="go('create')">＋ 開單</button>`;
  const wrap = app.querySelector(".wrap");
  try {
    if (state.tab === "admin") return renderAdmin(wrap);
    if (state.tab === "members") return renderMembers(wrap);
    const list = await api(`/api/order/list?tab=${state.tab}&g=${encodeURIComponent(GROUP)}`);
    let html = "";
    if (state.tab === "mine") {
      const me = await api(`/api/order/me?g=${encodeURIComponent(GROUP)}`); ME.summary = me.summary;
      html += `<div class="sum"><div class="k">待領取</div><div class="n">${fmt(ME.summary.unpaid)} 💎</div>
               <div class="k">已領 ${fmt(ME.summary.paid)} 💎 · 參加 ${ME.summary.count} 張單</div></div>`;
    }
    if (!list.length) html += `<div class="empty">目前沒有單</div>`;
    for (const o of list) {
      let right = `<span class="v">${o.count} 人</span>`;
      let extra = "";
      if (state.tab === "mine" && o.per_person != null && o.status !== "open") {
        extra = `<div class="row"><span class="l">我可分</span><span class="v" style="color:var(--primary)">${fmt(o.per_person)} 💎
                 <span class="pill ${o.my_paid ? "p-paid" : "p-unpaid"}">${o.my_paid ? "已領" : "待領"}</span></span></div>`;
      } else if (o.joined && o.status === "open") {
        extra = `<div class="row"><span class="l">我</span><span class="pill p-me">已報名</span></div>`;
      }
      const per = o.per_person != null && o.status !== "open" ? ` · 每人 ${fmt(o.per_person)} 💎` : "";
      html += `<div class="card tap" onclick="go('detail',{orderId:${o.id}})">
        <div class="row"><span class="big">${esc(o.boss)}</span><span class="pill p-${o.status}">${STATUS[o.status]}</span></div>
        ${o.items ? `<div class="sm">${esc(o.items)}</div>` : ""}
        <div class="row"><span class="l">#${o.id} · ${date(o.created_at)}${per}</span>${right}</div>${extra}</div>`;
    }
    wrap.innerHTML = html;
  } catch (e) { wrap.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

// 管理員總覽：全盟還沒領的鑽
// 管理員總覽：全盟（所有群組）還沒領的鑽；點人名展開明細，可一鍵發完
let ADMIN_ROWS = [];
async function renderAdmin(wrap) {
  ADMIN_ROWS = await api(`/api/order/admin`);
  const total = ADMIN_ROWS.reduce((s, r) => s + r.amount, 0);
  wrap.innerHTML = `<div class="sum"><div class="k">全盟尚未發放（所有群組）</div><div class="n">${fmt(total)} 💎</div><div class="k">${ADMIN_ROWS.length} 人待領</div></div>
    <div class="card">${ADMIN_ROWS.length ? ADMIN_ROWS.map((r, i) => `
      <div class="rank tap" onclick="toggleUser(${i})"><span class="av">${esc(r.name.slice(0, 1))}</span>
        <span style="flex:1">${esc(r.name)}<div class="sm">${r.count} 張單 · 點開看明細</div></span>
        <span class="v" style="color:var(--primary)">${fmt(r.amount)} 💎</span></div>
      <div id="ud${i}" style="display:none"></div>`).join("")
      : `<div class="empty" style="padding:20px 0">全部都發完了 🎉</div>`}</div>`;
}
async function toggleUser(i) {
  const box = document.getElementById("ud" + i);
  if (box.style.display !== "none") { box.style.display = "none"; return; }
  box.style.display = "block";
  box.innerHTML = `<div class="sm" style="padding:8px 0 8px 40px">載入中…</div>`;
  try {
    const list = await api(`/api/order/admin/user/${encodeURIComponent(ADMIN_ROWS[i].user_id)}`);
    const sum = list.reduce((s, o) => s + o.amount, 0);
    box.innerHTML = `<div style="background:var(--bg);border-radius:10px;padding:6px 12px;margin:2px 0 10px 40px">
      ${list.map(o => `<div class="row tap" style="padding:6px 0;border-bottom:1px solid var(--line)" onclick="go('detail',{orderId:${o.id}})">
        <span>${esc(o.boss)} <span class="sm">#${o.id} · ${date(o.created_at)}</span></span><span class="v">${fmt(o.amount)} 💎 ›</span></div>`).join("")}
      <button class="btn b-gold" style="margin:10px 0 6px;padding:10px;font-size:14px" onclick="payAll(${i}, ${list.length}, ${sum})">全部標記已發（${list.length} 張・${fmt(sum)} 💎）</button></div>`;
  } catch (e) { box.innerHTML = `<div class="sm" style="padding:8px 0 8px 40px">${esc(e.message)}</div>`; }
}
async function payAll(i, n, sum) {
  const r = ADMIN_ROWS[i];
  if (!confirm(`確定已經發給「${r.name}」${n} 張單、共 ${fmt(sum)} 💎？`)) return;
  try {
    const res = await api(`/api/order/admin/user/${encodeURIComponent(r.user_id)}/payall`, {});
    toast(`已標記 ${res.count} 張、${fmt(res.amount)} 💎`);
    renderList();
  } catch (e) { toast(e.message); }
}

// ========================= 畫面：人員管理（管理員）=========================
// 未綁定成員：管理員先建立、還不知道 LINE 的人；本人加入名冊（同遊戲名）會自動接上，也可以手動綁定
let MEMBERS = [], BIND_LIST = [];
async function renderMembers(wrap) {
  MEMBERS = await api("/api/order/admin/members");
  wrap.innerHTML = `
    <div class="card"><div class="v">＋ 新增未綁定成員</div>
      <div class="sm" style="margin-top:2px">還沒登記名冊的人，先建立起來就能開單分鑽。本人之後「加入名冊」時遊戲名一樣，就會自動接上。</div>
      <label>血盟</label><input type="text" id="mClan" maxlength="50" placeholder="例如：酒窖">
      <label>遊戲名</label><input type="text" id="mName" maxlength="50" placeholder="例如：威士忌乄">
      <button class="btn b-primary" onclick="addMember()">新增</button></div>
    <div class="card" style="padding:4px 14px">${MEMBERS.length ? MEMBERS.map((m, i) => `
      <div class="mem"><span class="av">${esc(m.name.slice(0, 1))}</span>
        <span class="n">${esc(m.name)} <span class="sm">${esc(m.clan)}</span>
          ${m.unpaid ? `<div class="sm" style="color:var(--warn)">待領 ${fmt(m.unpaid)} 💎</div>` : ""}</span>
        <button class="pill p-me" onclick="openBind(${i})">綁定</button>
        <button class="x" onclick="delMember(${i})">✕</button></div>
      <div id="bind${i}" style="display:none"></div>`).join("")
      : `<div class="empty" style="padding:20px 0">目前沒有未綁定成員</div>`}</div>`;
}
async function addMember() {
  const clan = document.getElementById("mClan").value.trim(), name = document.getElementById("mName").value.trim();
  if (!clan || !name) return toast("請填寫血盟和遊戲名");
  try { await api("/api/order/admin/members", { clan, name }); toast("已新增"); renderList(); } catch (e) { toast(e.message); }
}
async function delMember(i) {
  const m = MEMBERS[i];
  if (!confirm(`刪除未綁定成員「${m.name}」？`)) return;
  try { await api(`/api/order/admin/members/${encodeURIComponent(m.user_id)}/delete`, {}); toast("已刪除"); renderList(); } catch (e) { toast(e.message); }
}
// 綁定：從已加入名冊的人裡選一位
async function openBind(i) {
  const box = document.getElementById("bind" + i);
  if (box.style.display !== "none") { box.style.display = "none"; return; }
  box.style.display = "block";
  if (!BIND_LIST.length) {
    try { BIND_LIST = (await api(`/api/order/roster?g=${encodeURIComponent(GROUP)}`)).filter(p => !p.placeholder); }
    catch (e) { toast(e.message); return; }
  }
  box.innerHTML = `<div style="background:var(--bg);border-radius:10px;padding:10px 12px;margin:2px 0 10px">
    <div class="sm">把「${esc(MEMBERS[i].name)}」的開單紀錄和待領的鑽，轉給：</div>
    <input type="search" placeholder="搜尋已登記的成員" style="margin-top:6px" oninput="drawBind(${i}, this.value)">
    <div class="chips" id="bindChips${i}" style="margin-top:8px"></div></div>`;
  drawBind(i, "");
}
function drawBind(i, kw) {
  kw = (kw || "").trim().toLowerCase();
  const list = BIND_LIST.filter(p => !kw || p.name.toLowerCase().includes(kw) || (p.clan || "").toLowerCase().includes(kw)).slice(0, 40);
  document.getElementById("bindChips" + i).innerHTML = list.map(p =>
    `<button class="chip" onclick="doBind(${i}, '${esc(p.user_id)}')">${esc(p.name)}<span class="c">${esc(p.clan || "")}</span></button>`).join("")
    || `<div class="sm">找不到符合的人（對方要先加入名冊）</div>`;
}
async function doBind(i, uid) {
  const m = MEMBERS[i], p = BIND_LIST.find(x => x.user_id === uid);
  if (!confirm(`把「${m.name}」綁定到「${p ? p.name : ""}」？綁定後無法復原。`)) return;
  try { const r = await api(`/api/order/admin/members/${encodeURIComponent(m.user_id)}/bind`, { user_id: uid }); toast(`已綁定，轉移 ${r.moved} 筆紀錄`); BIND_LIST = []; renderList(); }
  catch (e) { toast(e.message); }
}

// ========================= 畫面：開單 =========================
let roster = [], picked = new Set(), showAll = false;
async function renderCreate() {
  picked = new Set([ME.user_id]); showAll = !GROUP;
  app.innerHTML = `<div class="top"><div class="t"><button class="back" onclick="go('list')">‹</button>＋ 新增開單</div></div>
    <div class="wrap">
      <label>哪隻王</label><input type="text" id="boss" list="bosses" placeholder="例如：克特" maxlength="50">
      <datalist id="bosses">${(ME.bosses || []).map(b => `<option value="${esc(b)}">`).join("")}</datalist>
      <label>掉落物品</label><input type="text" id="items" placeholder="例如：克特的長劍、魔法書" maxlength="200">
      <label>參加者（從名冊勾選）</label>
      <input type="search" id="kw" placeholder="搜尋名字或血盟" oninput="drawChips()">
      <div class="row" style="margin-top:8px"><span class="sm" id="scopeHint"></span>
        <button class="chip" id="scopeBtn" onclick="showAll=!showAll;drawChips()"></button></div>
      <div class="chips" id="chips" style="margin-top:8px"><div class="sm">載入名冊中…</div></div>
      <div class="hint" id="pickedHint"></div>
      <div class="hint">沒勾到的人，也可以之後自己按「我要報名」。</div>
      <button class="btn b-primary" id="submit" onclick="submitCreate()">開單並通知群組</button>
    </div>`;
  try { roster = await api(`/api/order/roster?g=${encodeURIComponent(GROUP)}`); } catch (e) { roster = []; toast(e.message); }
  if (!roster.some(p => p.user_id === ME.user_id)) roster.unshift({ user_id: ME.user_id, name: ME.name, clan: ME.clan, in_group: true });
  drawChips();
}
function drawChips() {
  const kw = (document.getElementById("kw").value || "").trim().toLowerCase();
  // 預設只列本群出現過的人＋已勾選的人；按「顯示全部」可看所有群組
  const scope = roster.filter(p => showAll || p.in_group || picked.has(p.user_id));
  const list = scope.filter(p => !kw || p.name.toLowerCase().includes(kw) || (p.clan || "").toLowerCase().includes(kw));
  const others = roster.length - roster.filter(p => p.in_group).length;
  document.getElementById("scopeHint").textContent = showAll ? `所有群組 ${roster.length} 人` : `本群 ${roster.length - others} 人`;
  const sb = document.getElementById("scopeBtn");
  sb.style.display = GROUP && others > 0 ? "" : "none";
  sb.textContent = showAll ? "只看本群" : `顯示全部（+${others}）`;
  document.getElementById("chips").innerHTML = list.map(p =>
    `<button class="chip ${picked.has(p.user_id) ? "on" : ""}" onclick="togglePick('${esc(p.user_id)}')">${esc(p.name)}<span class="c">${esc(p.clan || "")}${p.placeholder ? "・未綁定" : ""}</span></button>`
  ).join("") || `<div class="sm">找不到符合的人</div>`;
  document.getElementById("pickedHint").textContent = `已選 ${picked.size} 人`;
}
function togglePick(uid) { if (uid === ME.user_id) return toast("開單者會自動列入"); picked.has(uid) ? picked.delete(uid) : picked.add(uid); drawChips(); }
async function submitCreate() {
  const boss = document.getElementById("boss").value.trim();
  if (!boss) return toast("請填寫是哪隻王");
  const btn = document.getElementById("submit"); btn.disabled = true;
  try {
    const r = await api("/api/order", { boss, items: document.getElementById("items").value.trim(), members: [...picked], g: GROUP });
    await notifyGroup(r.id);
    toast("開單成功");
    go("detail", { orderId: r.id });
  } catch (e) { toast(e.message); btn.disabled = false; }
}

// ========================= 畫面：單據內容 =========================
async function renderDetail() {
  app.innerHTML = `<div class="top"><div class="t"><button class="back" onclick="go('list')">‹</button>載入中…</div></div>`;
  let o;
  try { o = await api(`/api/order/${state.orderId}`); CUR = o; }
  catch (e) { app.innerHTML += `<div class="wrap"><div class="empty">${esc(e.message)}</div></div>`; return; }
  const n = o.members.length, open = o.status === "open", done = o.status === "closed" || o.status === "canceled";
  let html = `<div class="top"><div class="t"><button class="back" onclick="go('list')">‹</button>${esc(o.boss)} #${o.id}
      <span class="pill p-${o.status}" style="margin-left:auto">${STATUS[o.status]}</span></div>
      <div class="s">開單者 ${esc(o.creator_name)} · ${date(o.created_at)}</div></div><div class="wrap">`;
  if (o.items) html += `<div class="card"><div class="l">掉落物品</div><div class="v" style="margin-top:2px">${esc(o.items)}</div></div>`;

  // 實收金額（開單者 / 管理員可填；結單後只顯示）
  if (o.can_manage && !done) {
    html += `<div class="card"><label style="margin-top:0">實收金額（扣完稅、實際拿到的鑽）</label>
      <input inputmode="numeric" id="amount" placeholder="例如：11400" value="${o.amount ?? ""}" oninput="previewPer(${n})">
      <button class="btn b-primary" style="margin-top:8px" onclick="doSettle(${o.id})">${o.status === "settled" ? "更新金額" : "填入並計算"}</button></div>`;
  }
  const per = o.per_person != null ? o.per_person : null;
  html += `<div class="sum"><div class="k">${n} 人均分 · 每人可分</div><div class="n" id="per">${per != null ? fmt(per) : "—"} 💎</div>
    <div class="k" id="perNote">${o.amount != null ? `實收 ${fmt(o.amount)} 💎` : "尚未填實收金額"}</div></div>`;

  // 參加者名單
  const showPaid = o.status === "settled" || o.status === "closed";
  html += `<div class="card" style="padding:4px 14px">${o.members.map(m => {
    let right = "";
    if (showPaid) {
      right = o.can_manage
        ? `<button class="pill ${m.paid ? "p-paid" : "p-unpaid"}" onclick="togglePaid(${o.id},'${esc(m.user_id)}',${!m.paid})">${m.paid ? "已發" : "未發"}</button>`
        : `<span class="pill ${m.paid ? "p-paid" : "p-unpaid"}">${m.paid ? "已發" : "未發"}</span>`;
    } else if (open && o.can_manage && m.user_id !== o.creator_id) {
      right = `<button class="x" onclick="removeMember(${o.id},'${esc(m.user_id)}')">✕</button>`;
    }
    const tag = m.user_id === o.creator_id ? ` <span class="sm">開單者</span>` : (m.user_id === ME.user_id ? ` <span class="sm">我</span>` : "");
    return `<div class="mem"><span class="av">${esc(m.name.slice(0, 1))}</span><span class="n">${esc(m.name)}${tag}</span>${right}</div>`;
  }).join("") || `<div class="empty" style="padding:16px 0">還沒有人報名</div>`}</div>`;
  if (showPaid && o.can_manage) html += `<div class="hint" style="margin:-4px 2px 8px">點「未發 / 已發」可以切換；全部標記已發會自動結單。</div>`;

  // 操作按鈕
  if (open && !o.joined) html += `<button class="btn b-gold" onclick="doAct(${o.id},'join','報名成功')">我要報名</button>`;
  if (open && o.joined && ME.user_id !== o.creator_id) html += `<button class="btn b-grey" onclick="doAct(${o.id},'leave','已退出')">退出報名</button>`;
  if (o.status === "settled" && o.can_manage) html += `<button class="btn b-gold" onclick="doClose(${o.id})">全部發完・結單</button>`;
  if (open && o.can_manage) html += `<button class="btn b-danger" onclick="doCancel(${o.id})">取消這張單</button>`;
  app.innerHTML = html + `</div>`;
}

// 輸入實收金額時即時試算（無條件捨去）
function previewPer(n) {
  const v = parseInt((document.getElementById("amount").value || "").replace(/[^\d]/g, ""), 10);
  document.getElementById("per").textContent = (n && !isNaN(v) ? fmt(Math.floor(v / n)) : "—") + " 💎";
  document.getElementById("perNote").textContent = isNaN(v) ? "尚未填實收金額" : `實收 ${fmt(v)} 💎（試算）`;
}
async function doSettle(id) {
  const v = (document.getElementById("amount").value || "").replace(/[^\d]/g, "");
  if (!v) return toast("請填實收金額");
  try { await api(`/api/order/${id}/settle`, { amount: v }); await notifyGroup(id); toast("已計算分配"); renderDetail(); }
  catch (e) { toast(e.message); }
}
async function doAct(id, action, okMsg) { try { await api(`/api/order/${id}/${action}`, {}); toast(okMsg); renderDetail(); } catch (e) { toast(e.message); } }
async function togglePaid(id, uid, paid) { try { await api(`/api/order/${id}/paid`, { user_id: uid, paid }); renderDetail(); } catch (e) { toast(e.message); } }
async function removeMember(id, uid) { const m = (CUR?.members || []).find(x => x.user_id === uid); if (!confirm(`把「${m ? m.name : "這個人"}」移出名單？`)) return; try { await api(`/api/order/${id}/remove`, { user_id: uid }); renderDetail(); } catch (e) { toast(e.message); } }
async function doClose(id) { if (!confirm("確定全部都發完了？結單後所有人會標記為已發。")) return; try { await api(`/api/order/${id}/close`, {}); await notifyGroup(id); toast("已結單"); renderDetail(); } catch (e) { toast(e.message); } }
async function doCancel(id) { if (!confirm("確定取消這張單？")) return; try { await api(`/api/order/${id}/cancel`, {}); toast("已取消"); go("list"); } catch (e) { toast(e.message); } }

// ========================= 啟動 =========================
function render() {
  if (state.view === "create") return renderCreate();
  if (state.view === "detail") return renderDetail();
  return renderList();
}
async function main() {
  if (!LIFF_ID || LIFF_ID.startsWith("__")) { app.innerHTML = `<div class="empty">尚未設定 LIFF_ID</div>`; return; }
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    ME = await api(`/api/order/me?g=${encodeURIComponent(GROUP)}`);
  } catch (e) { app.innerHTML = `<div class="empty">${esc(e.message || e)}</div>`; return; }
  if (!ME.in_roster) toast("你還沒加入名冊，名字會顯示 LINE 暱稱");
  if (Q.get("order")) state = { view: "detail", tab: "open", orderId: parseInt(Q.get("order"), 10) };
  else if (Q.get("new")) state.view = "create";
  render();
}
main();
</script>
</body>
</html>
